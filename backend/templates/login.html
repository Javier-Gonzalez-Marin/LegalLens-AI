<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LegalLens - Acceso Abogados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; margin: auto; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        .btn-legal { background-color: #2c3e50; color: white; width: 100%; }
        .btn-legal:hover { background-color: #1a252f; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">LegalLens <small class="text-muted">AI</small></h2>
        <p class="text-center text-muted">Portal exclusivo para abogados</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-legal mt-2">Iniciar Sesión</button>
        </form>
        
        {% if form.errors %}
            <div class="alert alert-danger mt-3">Usuario o contraseña incorrectos.</div>
        {% endif %}
    </div>
</body>
</html>
